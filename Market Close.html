<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Close Template</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Lato:wght@400;700&family=Noto+Serif+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#d9d9d4;--field:#fafaf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#212126;--ink:#ececec;--mute:#9a9aa2;--line:#3a3a42;--field:#18181c}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#212126;--ink:#ececec;--mute:#9a9aa2;--line:#3a3a42;--field:#18181c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,system-ui,sans-serif;line-height:1.4}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start}
.panel h2{font:600 15px Lora,serif;margin:0 0 10px}
.panel h3{font:700 13px Lato,sans-serif;margin:16px 0 6px}
.row{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;margin-bottom:6px}
.row.four{grid-template-columns:1fr 1.2fr .6fr .9fr}
.row.two{grid-template-columns:1fr 1fr}
.row.one{grid-template-columns:1fr}
input,select,textarea{width:100%;padding:7px 8px;font:14px Lato,sans-serif;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #1f3fd1;outline-offset:1px}
textarea{resize:vertical;font:13px/1.4 Lato,sans-serif}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:700 13px Lato,sans-serif;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:#1f3fd1;color:#fff;border-color:#1f3fd1}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.stage{display:flex;justify-content:center;min-width:0}
.card{--blue:#0b2a87;--up:#17a34a;--down:#d93a3a;--flat:#8a8a8a;
width:100%;max-width:560px;aspect-ratio:4/5;height:auto;overflow:hidden;background:#fffcf4;color:#000;container-type:inline-size;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.in{height:100%;padding:6cqw 6cqw 4.6cqw;display:flex;flex-direction:column;container-type:inline-size}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;padding-bottom:3.6cqw;border-bottom:1.6cqw double #000}
.brand{font:700 4.25cqw Lora,serif;letter-spacing:.34em}
.date{font:400 2.55cqw Lato,sans-serif;text-align:right;line-height:1.3;white-space:pre-line;flex:none}
.ttl{margin-bottom:-.13em;font:500 4.76cqw/1 Lora,serif;color:var(--blue);text-align:right;flex:none;white-space:nowrap}
.logo{display:block;height:calc(var(--ls,100)*.085cqw);max-width:60cqw;width:auto;object-fit:contain;object-position:left center}
.title{font:700 8.16cqw Lora,serif;text-align:center;margin:6cqw 0 5cqw;letter-spacing:-.01em;line-height:1}
.grid{margin-top:5cqw;min-height:0;display:grid;grid-template-columns:.84fr 1.16fr;gap:2.6cqw;padding:0;flex:1;grid-template-rows:repeat(3,1fr) 1.2fr;align-content:stretch}
.tile{background:linear-gradient(135deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.42) 55%,rgba(255,255,255,.28) 100%);-webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%);box-shadow:0 .8cqw 3.4cqw rgba(11,42,135,.14);border:.25cqw solid rgba(255,255,255,.8);border-radius:2.4cqw;padding:2.6cqw 3cqw;min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}
.tile .l{font:400 2.55cqw Lato,sans-serif;display:flex;align-items:center;gap:1.2cqw;color:#5a5446;letter-spacing:.01em}
.tk{font-family:"Noto Serif Bengali",Lora,serif;font-weight:600;font-size:calc(var(--tks,.88)*1em);position:relative;top:calc(var(--tky,0)*1em);letter-spacing:0;margin-right:calc(var(--tkg,0)*1em);line-height:1}
.ic{width:3.4cqw;height:3.4cqw;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;flex:none}
.tile .v{font:500 6.97cqw Lora,serif;color:var(--blue);letter-spacing:-.04em;line-height:1.15;white-space:nowrap;display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
.tile .v .n{min-width:0}
.tile .s{font:400 2.3cqw Lato,sans-serif;color:#6f6b62;text-align:right}
.chg{display:inline-flex;flex-direction:row;align-items:center;gap:.9cqw;margin-left:auto;flex:none;font:400 2.55cqw Lato,sans-serif;line-height:1.1}
.chg svg{width:3.4cqw;height:2.1cqw}
.full .lr{justify-content:center}
.lr{min-height:4.4cqw;display:flex;align-items:center;justify-content:space-between;gap:1.5cqw}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.flat{color:var(--flat)}
.chg.up svg{fill:var(--up)}.chg.down svg{fill:var(--down);transform:rotate(180deg)}.chg.flat svg{fill:var(--flat)}
.full{grid-column:1/-1;align-items:center;text-align:center}
.full .l{justify-content:center}
.full .v{justify-content:center}
.foot{border-top:.5cqw solid #000;margin-top:4.4cqw;padding-top:2cqw;display:flex;justify-content:space-between;align-items:baseline;gap:3cqw}
.foot span{font:400 2.38cqw/1.3 Lato,sans-serif;color:#555;white-space:nowrap;margin:0;padding:0}
</style>
</head>
<body>
<div class="app">
  <section class="panel" aria-label="Editor">
    <h2>Quick update</h2>
    <textarea id="paste" rows="5" aria-label="Paste DSE data" placeholder="Paste text copied from dse.com.bd (market summary, or the Daily Turnover notice). Leave empty to just set today's date."></textarea>
    <div class="btns" style="margin-top:8px"><button class="pri" id="upd">Update date &amp; data</button></div>
    <p class="hint" id="ust"></p>
    <h2 style="margin-top:18px">Edit the card</h2>
    <div class="row two"><input id="date" type="date" aria-label="Date"><input id="foot" aria-label="Source"></div>
    <h3>Indices</h3><div id="idx"></div>
    <h3>Statistics</h3><div id="stats"></div>
    <h3>Market cap</h3>
    <div class="row two"><input id="hl" aria-label="Label"><input id="hv" aria-label="Value"></div>
    <div class="btns">
      <button class="pri" id="dl" disabled>Download PNG (1080 x 1350)</button>
      <button id="reset">Reset</button>
    </div>
    <p class="hint" id="st"></p>
  </section>
  <section class="stage"><div class="card" id="card"></div></section>
</div>

  const c=$("card");c.style.setProperty("--blue",BLUE);
  const L=S.idx.map(([l,v,p,d],i)=>`<div class="tile"><div class="lr">${lab(i,l)}${chg(p,d)}</div><div class="v"><span class="n">${tkf(v)}</span></div><div class="s">&nbsp;</div></div>`);
  const R=S.stats.map(([l,v,s],i)=>`<div class="tile"><div class="lr">${lab(3+i,l)}</div><div class="v"><span class="n">${tkf(v)}</span></div><div class="s">${esc(s)}&nbsp;</div></div>`);
  let t="";for(let i=0;i<3;i++)t+=L[i]+R[i];
  c.innerHTML=`<div class="in"><div class="mast"><img class="logo" src="${LOGO}" alt="Banijjik Express" style="--ls:98"><div class="ttl">${esc(S.title)}</div></div><div class="grid">${t}<div class="tile full"><div class="lr">${lab(6,S.hl[0])}</div><div class="v"><span class="n">${tkf(S.hl[1])}</span></div></div></div><div class="foot"><span>${esc(S.foot)}</span><span>${esc(dateText())}</span></div></div>`;
  fit();
}
function fit(){
  const vs=[...document.querySelectorAll("#card .tile .v")];vs.forEach(v=>v.style.fontSize="");let m=Infinity;
  vs.forEach(v=>{const t=v.parentElement,cs=getComputedStyle(t),w=t.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);let f=parseFloat(getComputedStyle(v).fontSize);v.style.fontSize=f+"px";while(v.scrollWidth>w+1&&f>10){f-=1;v.style.fontSize=f+"px"}m=Math.min(m,f)});
  vs.forEach(v=>v.style.fontSize=m+"px");
}
addEventListener("resize",fit);if(document.fonts)document.fonts.ready.then(fit);
const opt=(v,c)=>`<option value="${v}"${c===v?" selected":""}>${v[0].toUpperCase()+v.slice(1)}</option>`;
function build(){
  $("date").value=S.date;$("foot").value=S.foot;$("hl").value=S.hl[0];$("hv").value=S.hl[1];
  $("idx").innerHTML=S.idx.map((r,i)=>`<div class="row four"><input data-g="idx" data-i="${i}" data-j="0" value="${esc(r[0])}" aria-label="Name"><input data-g="idx" data-i="${i}" data-j="1" value="${esc(r[1])}" aria-label="Value"><input data-g="idx" data-i="${i}" data-j="2" value="${esc(r[2])}" aria-label="Change percent"><select data-g="idx" data-i="${i}" data-j="3" aria-label="Arrow">${["auto","up","down","flat"].map(v=>opt(v,r[3])).join("")}</select></div>`).join("");
  $("stats").innerHTML=S.stats.map((r,i)=>`<div class="row"><input data-g="stats" data-i="${i}" data-j="0" value="${esc(r[0])}" aria-label="Label"><input data-g="stats" data-i="${i}" data-j="1" value="${esc(r[1])}" aria-label="Value"><input data-g="stats" data-i="${i}" data-j="2" value="${esc(r[2])}" aria-label="Note"></div>`).join("");
  render();
}
document.addEventListener("input",e=>{const t=e.target,g=t.dataset.g;
  if(g)S[g][t.dataset.i][t.dataset.j]=t.value;
  else if(t.id==="date")S.date=t.value;else if(t.id==="foot")S.foot=t.value;else if(t.id==="hl")S.hl[0]=t.value;else if(t.id==="hv")S.hl[1]=t.value;else return;
  render()});
$("reset").onclick=()=>{S=JSON.parse(JSON.stringify(DEF));build()};

/*QU*/
const MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const NUM="([0-9]{1,3}(?:,[0-9]{3})+(?:\\.[0-9]+)?|[0-9]{4,}(?:\\.[0-9]+)?)",UNIT="\\s*(trillion|billion|million|crore|tn|bn|mn|cr)?";
const fmtN=(n,d)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const todayDhaka=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Dhaka"});
function foundDates(t){const o=new Set(),p=n=>String(n).padStart(2,"0");let m;
  const a=/\b(\d{1,2})[.\/](\d{1,2})[.\/](20\d{2})\b/g;while((m=a.exec(t)))o.add(`${m[3]}-${p(m[2])}-${p(m[1])}`);
  const b=/\b(20\d{2})-(\d{2})-(\d{2})\b/g;while((m=b.exec(t)))o.add(m[0]);
  const c=/\b(\d{1,2})(?:st|nd|rd|th)?[\s-]+([A-Za-z]{3,9}),?[\s-]+(20\d{2})\b/g;
  while((m=c.exec(t))){const i=MON.indexOf(m[2].slice(0,3).toLowerCase());if(i>=0)o.add(`${m[3]}-${p(i+1)}-${p(m[1])}`)}
  return [...o]}
function findIdx(t,name){const re=new RegExp("\\b"+name+"\\b[^0-9+\\-\u2212\u25b2\u25bc]{0,25}([0-9][0-9,]*\\.[0-9]+)","gi");let m;
  while((m=re.exec(t))){const after=t.slice(re.lastIndex,re.lastIndex+90),p=after.match(/([0-9]+(?:\.[0-9]+)?)\s*%/);let pct="";
    if(p){const seg=after.slice(0,p.index+p[0].length);pct=((/[-\u2212\u25bc]/.test(seg)&&!/[+\u25b2]/.test(seg))?"-":"")+p[1]}
    return [fmtN(parseFloat(m[1].replace(/,/g,"")),2),pct]}
  return null}
const toMn=(n,u)=>{u=(u||"").toLowerCase();return /^(tn|trillion)/.test(u)?n*1e6:/^(bn|billion)/.test(u)?n*1e3:/^cr/.test(u)?n*10:/^(mn|million)/.test(u)?n:(n>=1e9?n/1e6:n)};
function grabNum(t,label){const m=t.match(new RegExp(label+"[^0-9]{0,30}"+NUM+UNIT,"i"));return m?[parseFloat(m[1].replace(/,/g,"")),m[2]]:null}
function parseDse(t){const r={date:null,idx:{},stats:{}},ds=foundDates(t);r.date=ds.length===1?ds[0]:null;
  ["DSEX","DS30","DSES"].forEach(n=>{const x=findIdx(t,n);if(x)r.idx[n]=x});
  let g=grabNum(t,"turnover");if(g)r.turnover="\u09f3"+fmtN(toMn(g[0],g[1]),2)+"mn";
  g=grabNum(t,"volume");if(g)r.volume=fmtN(g[0],0);
  g=grabNum(t,"trades?");if(g)r.trades=fmtN(g[0],0);
  g=grabNum(t,"market\\s*cap\\w*");if(g)r.mcap="\u09f3"+fmtN(toMn(g[0],g[1]),2)+"mn";
  return r}
/*END*/
function applyPaste(){const t=$("paste").value,msg=$("ust"),got=[],miss=[];
  const r=parseDse(t);S.date=r.date||todayDhaka();
  if(t.trim()){
    ["DSEX","DS30","DSES"].forEach((n,i)=>{if(r.idx[n]){S.idx[i][1]=r.idx[n][0];S.idx[i][2]=r.idx[n][1];S.idx[i][3]="auto";got.push(n)}else miss.push(n)});
    [["turnover",()=>S.stats[0][1]=r.turnover,"Turnover"],["volume",()=>S.stats[1][1]=r.volume,"Volume"],["trades",()=>S.stats[2][1]=r.trades,"Trades"],["mcap",()=>S.hl[1]=r.mcap,"Market cap"]]
      .forEach(([k,set,l])=>{if(r[k]){set();got.push(l)}else miss.push(l)});
  }
  build();
  msg.textContent=!t.trim()?"Date set to "+dateText()+". Paste DSE text to fill the numbers.":got.length?"Date "+dateText()+". Filled: "+got.join(", ")+(miss.length?". Not found: "+miss.join(", ")+" (edit below).":"."):"Date "+dateText()+". No market figures found in that text."}
$("upd").onclick=applyPaste;
async function draw(){
  await Promise.all([document.fonts.load('500 60px Lora'),document.fonts.load('400 30px Lato'),document.fonts.load('600 60px "Noto Serif Bengali"','\u09f3')]);
  const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('logo'));i.src=LOGO});
  const W=1080,H=1350,u=W/100*.88,P=W*.06,B=W*.046,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d"),LS=(v)=>{x.letterSpacing=v+"px"};
  x.fillStyle="#fffcf4";x.fillRect(0,0,W,H);
  const lh=98*.085*u,lw=lh*img.width/img.height;x.drawImage(img,P,P,lw,lh);
  x.fillStyle=BLUE;x.font=`500 ${4.76*u}px Lora`;x.textAlign="right";x.textBaseline="alphabetic";LS(0);x.fillText(S.title,W-P,P+lh);
  const ry=P+lh+3.6*u,rt=1.6*u/3;x.fillStyle="#000";x.fillRect(P,ry,W-2*P,rt);x.fillRect(P,ry+2*rt,W-2*P,rt);
  const fy=H-B-(.5*u+2*u+2.38*u*1.3),gy=ry+1.6*u+5*u,gb=fy-4.4*u,gap=2.6*u,rh=(gb-gy-3*gap)/4.2,gw=W-2*P,ca=gw-gap,lw2=ca*.42,rw2=ca*.58,pad=3*u;
  const seg=(s,f)=>s.split(/(\u09f3)/).filter(Boolean).map(t=>t==="\u09f3"?{t,font:`600 ${.88*f}px "Noto Serif Bengali"`,ls:0}:{t,font:`500 ${f}px Lora`,ls:-.045*f});
  const meas=(s,f)=>seg(s,f).reduce((a,g)=>{x.font=g.font;LS(g.ls);return a+x.measureText(g.t).width},0);
  const items=[...S.idx.map(r=>[r[1],lw2-2*pad]),...S.stats.map(r=>[r[1],rw2-2*pad]),[S.hl[1],gw-2*pad]];
  let f=6.97*u;while(f>10&&items.some(([s,w])=>meas(s,f)>w+1))f-=.5;
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
  const ICD=["M3 17L9 11L13 15L21 7M15 7H21V13","M5 20V11M11 20V4M17 20v-6M2 21h20","M12 3v9h9","","M12 3l9 5-9 5-9-5zM3 13l9 5 9-5","M4 8h14l-3-3M20 16H6l3 3","M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"];
  const icon=(i,ix,iy,sz)=>{x.save();x.translate(ix,iy);x.scale(sz/24,sz/24);x.globalAlpha=.8;x.strokeStyle=BLUE;x.lineWidth=2;x.lineCap="round";x.lineJoin="round";
    if(i===2||i===3){x.beginPath();x.arc(12,12,9,0,7);x.stroke()}
    if(i===3){x.fillStyle=BLUE;x.font='500 13px "Noto Serif Bengali"';x.textAlign="center";x.textBaseline="alphabetic";LS(0);x.fillText("\u09f3",12,17)}else x.stroke(new Path2D(ICD[i]));x.restore()};
  const tile=(tx,ty,tw,th,i,label,val,o)=>{
    x.save();rr(tx,ty,tw,th,2.4*u);x.rect(0,0,W,H);x.clip("evenodd");x.shadowColor="rgba(11,42,135,.14)";x.shadowBlur=3.4*u;x.shadowOffsetY=.8*u;rr(tx,ty,tw,th,2.4*u);x.fillStyle="#fff";x.fill();x.restore();{const L=(tw+th)*Math.SQRT1_2,cx=tx+tw/2,cy0=ty+th/2,d=L/2*Math.SQRT1_2,g=x.createLinearGradient(cx-d,cy0-d,cx+d,cy0+d);g.addColorStop(0,"rgba(255,255,255,.72)");g.addColorStop(.55,"rgba(255,255,255,.42)");g.addColorStop(1,"rgba(255,255,255,.28)");x.fillStyle=g}rr(tx,ty,tw,th,2.4*u);x.fill();x.strokeStyle="rgba(255,255,255,.8)";x.lineWidth=.25*u;x.stroke();
    const lrH=4.4*u,hc=lrH+1.15*f+(o.full?0:2.3*u*1.4),top=ty+(th-hc)/2,cy=top+lrH/2,isz=3.4*u,fs=2.55*u;
    x.font=`400 ${fs}px Lato`;LS(.01*fs);const lw_=x.measureText(label).width;
    const lx=o.full?tx+tw/2-(isz+1.2*u+lw_)/2:tx+pad;icon(i,lx,cy-isz/2,isz);
    x.fillStyle="#5a5446";x.textAlign="left";x.textBaseline="middle";x.font=`400 ${fs}px Lato`;LS(.01*fs);x.fillText(label,lx+isz+1.2*u,cy);
    if(o.chg){const n=parseFloat(String(o.chg[0]).replace(/[^0-9.\-]/g,""));if(!isNaN(n)){const k=kind(n,o.chg[1]),col={up:"#17a34a",down:"#d93a3a",flat:"#8a8a8a"}[k],t=Math.abs(n).toFixed(2)+"%";
      x.font=`400 ${fs}px Lato`;LS(0);const tw_=x.measureText(t).width,rx=tx+tw-pad;x.fillStyle=col;x.textAlign="right";x.fillText(t,rx,cy);
      const aw=3.4*u,ah=2.1*u;x.save();x.translate(rx-tw_-.9*u-aw,cy-ah/2);x.scale(aw/24,ah/14);if(k==="down"){x.translate(12,7);x.rotate(Math.PI);x.translate(-12,-7)}
      x.fill(new Path2D("M12 1.5c.6 0 1.1.3 1.5.7l8.4 9.1c.8.9.2 2.2-1 2.2H3.1c-1.2 0-1.8-1.3-1-2.2l8.4-9.1c.4-.4.9-.7 1.5-.7z"));x.restore()}}
    const vTop=top+lrH,base=vTop+.941*f;let px=o.full?tx+tw/2-meas(val,f)/2:tx+pad;x.fillStyle=BLUE;x.textAlign="left";x.textBaseline="alphabetic";
    seg(val,f).forEach(g=>{x.font=g.font;LS(g.ls);x.fillText(g.t,px,base);px+=x.measureText(g.t).width});
    if(!o.full&&o.note){x.font=`400 ${2.3*u}px Lato`;LS(0);x.fillStyle="#6f6b62";x.textAlign="right";x.fillText(o.note,tx+tw-pad,vTop+1.15*f+1.087*2.3*u)}};
  for(let i=0;i<3;i++){const ty=gy+i*(rh+gap);
    tile(P,ty,lw2,rh,i,S.idx[i][0],S.idx[i][1],{chg:[S.idx[i][2],S.idx[i][3]]});
    tile(P+lw2+gap,ty,rw2,rh,3+i,S.stats[i][0],S.stats[i][1],{note:S.stats[i][2]})}
  tile(P,gy+3*(rh+gap),gw,rh*1.2,6,S.hl[0],S.hl[1],{full:true});
  x.fillStyle="#000";x.fillRect(P,fy,W-2*P,.5*u);x.font=`400 ${2.38*u}px Lato`;x.fillStyle="#555";x.textBaseline="alphabetic";LS(0);
  const fb=fy+.5*u+2*u+.05*2.38*u*1.3*0+ (1.3-1.2)/2*2.38*u+.987*2.38*u;
  x.textAlign="left";x.fillText(S.foot,P,fb);x.textAlign="right";x.fillText(dateText(),W-P,fb);
  return new Promise(r=>cv.toBlob(r,"image/png"));
}
let dl=null;
const fallback={save:({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return Promise.resolve()}};
(window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null)).then(d=>{dl=d||fallback;$("dl").disabled=false}).catch(()=>{dl=fallback;$("dl").disabled=false});
$("dl").onclick=async()=>{const st=$("st");if(!dl)return;st.textContent="Preparing image";
  try{const b=await draw();await dl.save({filename:"market-close-"+S.date+".png",data:b});st.textContent="Saved"}
  catch(e){st.textContent=e&&e.code==="declined"?"Download cancelled":"Download failed, try again"}};
